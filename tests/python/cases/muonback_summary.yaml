test:
  id: muonback_summary
  depends_on:
    - build_clean
  package_envs:
    - FAIRSHIP_ALIENV_PACKAGE
  workdir_env: FAIRSHIP_SIM_TEST_WORKDIR
  debug_env: FAIRSHIP_SIM_TEST_DEBUG
  timeout: 7200
  context:
    tag:
      env: FAIRSHIP_SIM_TEST_TAG
      default: pytest_validation
    n_events:
      env: FAIRSHIP_SIM_TEST_EVENTS
      default: 5000
      type: int
    extra_args:
      env: FAIRSHIP_SIM_TEST_EXTRA_ARGS
      default: --MuonBack --FollowMuon --FastMuon
    input_file:
      source: required_input_file
  runs:
    - name: simulation
      timeout: 7200
      command: >
        python3 {repo_root}/macro/run_simScript.py
        -n {n_events}
        -i 100
        {extra_args}
        -f {input_file}
        -o {tmp_path}
        --tag {tag}
        --sameSeed 42
        --seed 42
      outputs:
        - "{tmp_path}/sim_{tag}.root"
        - "{tmp_path}/geo_{tag}.root"
        - "{tmp_path}/params_{tag}.root"
    - name: validation
      timeout: 3600
      command: >
        python3 {repo_root}/macro/validate_simulation_output.py
        -f {tmp_path}/sim_{tag}.root
        -o {tmp_path}/sim_{tag}.validation.json
      outputs:
        - "{tmp_path}/sim_{tag}.validation.json"
  validations:
    - type: text_snapshot
      source: "{tmp_path}/validation.stdout"
      reference: "{repo_root}/tests/reference/muonback_fast_100.ref"
      artifact: "{tmp_path}/sim_{tag}.validation.log"
      normalize:
        replace:
          - old: "{tmp_path}/sim_{tag}.root"
            new: "{TMP_PATH}/sim_{tag}.root"
          - old: "{tmp_path}/sim_{tag}.validation.json"
            new: "{TMP_PATH}/sim_{tag}.validation.json"
    - type: step_stdout
      step: validation
      contains: "Validation summary for"

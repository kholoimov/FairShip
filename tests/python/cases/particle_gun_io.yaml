test:
  id: particle_gun_io
  package_envs:
    - FAIRSHIP_PARTICLE_GUN_ALIENV_PACKAGE
    - FAIRSHIP_ALIENV_PACKAGE
  workdir_env: FAIRSHIP_PARTICLE_GUN_TEST_WORKDIR
  debug_env: FAIRSHIP_PARTICLE_GUN_TEST_DEBUG
  timeout: 7200
  context:
    tag:
      env: FAIRSHIP_PARTICLE_GUN_TEST_TAG
      default: pytest_pg
    n_events:
      env: FAIRSHIP_PARTICLE_GUN_TEST_EVENTS
      default: 100
      type: int
      max: 100
      max_message: "{env} must be <= {max} for event-by-event IO comparison, got {value}"
    pid:
      env: FAIRSHIP_PARTICLE_GUN_TEST_PID
      default: 13
    estart:
      env: FAIRSHIP_PARTICLE_GUN_TEST_ESTART
      default: 1.0
    eend:
      env: FAIRSHIP_PARTICLE_GUN_TEST_EEND
      default: 10.0
    vz:
      env: FAIRSHIP_PARTICLE_GUN_TEST_VZ
      default: 8300.0
    dx:
      env: FAIRSHIP_PARTICLE_GUN_TEST_DX
      default: 50.0
    dy:
      env: FAIRSHIP_PARTICLE_GUN_TEST_DY
      default: 50.0
    debug_level:
      env: FAIRSHIP_PARTICLE_GUN_TEST_FAIRLOGGER_DEBUG
      default: 0
    reference_root:
      env: FAIRSHIP_PARTICLE_GUN_REFERENCE_ROOT
      default: "{repo_root}/tests/reference/sim_reference_run.root"
  runs:
    - name: particle_gun
      timeout: 7200
      command: >
        python3 {repo_root}/macro/run_simScript.py
        -n {n_events}
        -s 42
        --debug {debug_level}
        --vacuums
        --tag {tag}
        -o {tmp_path}
        PG
        --pID {pid}
        --Estart {estart}
        --Eend {eend}
        --Vz {vz}
        --multiplePG
        --Dx {dx}
        --Dy {dy}
      outputs:
        - "{tmp_path}/sim_{tag}.root"
    - name: particle_gun_compare
      timeout: 3600
      command: >
        python3 {repo_root}/macro/compare_simulation_root_files.py
        -r {reference_root}
        -c {tmp_path}/sim_{tag}.root
  validations:
    - type: step_stdout
      step: particle_gun_compare
      endswith: "ROOT file comparison passed."

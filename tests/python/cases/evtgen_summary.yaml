test:
  id: evtgen_summary
  depends_on:
    - build_clean
  package_envs:
    - FAIRSHIP_EVTGEN_ALIENV_PACKAGE
    - FAIRSHIP_ALIENV_PACKAGE
  workdir_env: FAIRSHIP_EVTGEN_TEST_WORKDIR
  debug_env: FAIRSHIP_EVTGEN_TEST_DEBUG
  timeout: 7200
  context:
    tag:
      env: FAIRSHIP_EVTGEN_TEST_TAG
      default: pytest_evtgen
    n_events:
      env: FAIRSHIP_EVTGEN_TEST_EVENTS
      default: 1000
      type: int
    debug_level:
      env: FAIRSHIP_EVTGEN_TEST_FAIRLOGGER_DEBUG
      default: 0
    reference_log:
      env: FAIRSHIP_EVTGEN_REFERENCE_LOG
      default: "{repo_root}/tests/reference/evtgen_reference_run.ref"
  runs:
    - name: evtgen
      timeout: 7200
      command: >
        python3 {repo_root}/macro/run_simScript.py
        --EvtGenDecayer
        -t
        -n {n_events}
        --debug {debug_level}
        -o {tmp_path}
        --tag {tag}
        --seed 42
      outputs:
        - "{tmp_path}/sim_{tag}.root"
        - "{tmp_path}/geo_{tag}.root"
        - "{tmp_path}/params_{tag}.root"
    - name: evtgen_validation
      timeout: 3600
      command: >
        python3 {repo_root}/macro/validate_simulation_output.py
        -f {tmp_path}/sim_{tag}.root
        -o {tmp_path}/sim_{tag}.validation.json
      outputs:
        - "{tmp_path}/sim_{tag}.validation.json"
  validations:
    - type: text_snapshot
      source: "{tmp_path}/evtgen_validation.stdout"
      reference: "{reference_log}"
      artifact: "{tmp_path}/sim_{tag}.validation.log"
      normalize:
        replace:
          - old: "{tmp_path}/sim_{tag}.root"
            new: "{TMP_PATH}/sim_{tag}.root"
          - old: "{tmp_path}/sim_{tag}.validation.json"
            new: "{TMP_PATH}/sim_{tag}.validation.json"
